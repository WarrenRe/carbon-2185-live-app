<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbon 2185 — Live Web & WebXR App</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050811;
      color: #e2f1ff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #viewport {
      position: fixed;
      inset: 0;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: rgba(8, 14, 28, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.45);
      border-radius: 10px;
      padding: 8px 12px;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.15);
    }

    .hud-pill strong {
      color: #00f0ff;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .hud-pill span {
      color: #cbd5e1;
      font-size: 12px;
    }

    .hud-divider {
      width: 1px;
      height: 16px;
      background: rgba(0, 240, 255, 0.3);
    }

    .hud-pill input {
      background: #0f172a;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      color: #fff;
      padding: 5px 8px;
      font-size: 12px;
      width: 170px;
    }

    .hud-pill input:focus {
      outline: none;
      border-color: #00f0ff;
    }

    .hud-pill button {
      background: #00f0ff;
      color: #050811;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .hud-pill button:hover {
      filter: brightness(1.1);
    }

    .hud-pill button.secondary {
      background: #1e293b;
      color: #e2f1ff;
      border: 1px solid #475569;
    }

    .hud-pill button.secondary:hover {
      border-color: #00f0ff;
      color: #00f0ff;
    }

    .status-bar {
      position: fixed;
      left: 14px;
      bottom: 18px;
      z-index: 20;
      max-width: min(460px, calc(100vw - 28px));
      background: rgba(8, 14, 28, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 12px;
      color: #38bdf8;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewport"></div>

  <header class="topbar">
    <div class="hud-pill">
      <strong id="hud-location">No Location</strong>
      <div class="hud-divider"></div>
      <span id="hud-character">No Operative Selected</span>
    </div>

    <div class="hud-pill">
      <input id="hud-inspect-input" type="text" placeholder="Inspect weapon, NPC, gang..." />
      <button id="hud-inspect-btn" type="button">Inspect</button>
      <button id="hud-menu-btn" type="button" class="secondary">Setup Menu</button>
    </div>
  </header>

  <div class="status-bar" id="hud-status">Initializing Carbon 2185 Live App...</div>

  <script type="module" src="./app.js"></script>
</body>
</html>
