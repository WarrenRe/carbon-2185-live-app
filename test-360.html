<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbon 2185 — 360° Scene Switcher Test</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050811; font-family: system-ui, sans-serif; color: #e2f1ff; }
    #hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(8, 14, 28, 0.85); border: 1px solid #00f0ff;
      border-radius: 10px; padding: 14px 16px; max-width: 360px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
    }
    h1 { font-size: 15px; margin: 0 0 6px; color: #00f0ff; letter-spacing: 0.06em; text-transform: uppercase; }
    #status { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
    #buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      background: #0f172a; color: #e2f1ff; border: 1px solid #38bdf8;
      border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    }
    button:hover { background: #0284c7; }
    button.active { background: #00f0ff; color: #050811; font-weight: 700; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>360° Skybox Switcher (Task 3.2)</h1>
    <div id="status">Loading carbon2185-db.json...</div>
    <div id="buttons"></div>
  </div>

  <script type="module">
    import * as THREE from "https://esm.sh/three@0.170.0";
    import { OrbitControls } from "https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js";
    import { AssetResolver } from "./assetResolver.js";
    import { SceneManager } from "./sceneManager.js";

    const statusEl = document.getElementById("status");
    const buttonsEl = document.getElementById("buttons");

    // 1. Set up Three.js camera, renderer & drag-to-look controls
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 0.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.enablePan = false;
    controls.rotateSpeed = -0.35; // Natural drag direction inside skybox

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // 2. Initialize AssetResolver & SceneManager
    const resolver = new AssetResolver();
    const sceneManager = new SceneManager(scene, resolver, { fadeDuration: 0.5 });

    async function boot() {
      try {
        await resolver.init(true);
        const locations = resolver.getCollection("Locations").filter((loc) => loc.image_360);

        if (!locations.length) {
          statusEl.textContent = "No locations with a 360 Scene URL found yet in carbon2185-db.json.";
          return;
        }

        statusEl.textContent = `Loaded ${locations.length} 360° locations. Click to cross-fade (0.5s):`;

        locations.forEach((loc, idx) => {
          const btn = document.createElement("button");
          btn.textContent = loc.name;
          btn.onclick = async () => {
            statusEl.textContent = `Transitioning to ${loc.name}...`;
            document.querySelectorAll("#buttons button").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            await sceneManager.setLocation(loc.name, (active) => {
              statusEl.textContent = `Active Scene: ${active.name} (Drag mouse to look 360°)`;
            });
          };
          buttonsEl.appendChild(btn);
          if (idx === 0) btn.click();
        });
      } catch (err) {
        statusEl.textContent = `Error: ${err.message}`;
        console.error(err);
      }
    }

    boot();
  </script>
</body>
</html>
